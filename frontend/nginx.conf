server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml;

    # Zasoby z hashem w nazwie — można cachować na zawsze.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Talia bywa podmieniana ręcznie — krótki cache, żeby zmiana była widoczna.
    location /data/ {
        add_header Cache-Control "public, max-age=300";
        types { text/csv csv; }
        default_type text/csv; charset utf-8;
    }

    # Backend w docker-compose. Prefix /api jest usuwany przed przekazaniem
    # żądania, bo kontrolery NestJS używają ścieżek /auth i /me.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: każdy nieznany adres oddaje index.html, żeby react-router obsłużył trasę.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
