name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lexo
          POSTGRES_PASSWORD: lexo
          POSTGRES_DB: lexodromia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexo -d lexodromia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lexo:lexo@localhost:5432/lexodromia_test?schema=public
      JWT_SECRET: ci-access-secret-that-is-longer-than-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-different-and-long-enough
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 30d
      BCRYPT_SALT_ROUNDS: 10
      AUTH_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm run prisma:generate
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm test -- --runInBand
        working-directory: backend
      - run: npm run prisma:migrate
        working-directory: backend
      - run: npm run prisma:seed
        working-directory: backend
      - run: npm run test:e2e
        working-directory: backend
