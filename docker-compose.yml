services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: lexodromia-frontend:latest
    container_name: lexodromia-frontend

    ports:
      - "8080:80"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
