services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bura-hr:latest
    container_name: bura-hr
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
