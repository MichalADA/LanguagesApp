services:
  postgres:
    image: postgres:16-alpine
    container_name: lexodromia-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexo}
      POSTGRES_DB: ${POSTGRES_DB:-lexodromia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lexo} -d ${POSTGRES_DB:-lexodromia}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lexodromia-backend:latest
    container_name: lexodromia-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lexo}:${POSTGRES_PASSWORD:-lexo}@postgres:5432/${POSTGRES_DB:-lexodromia}?schema=public

      JWT_SECRET: ${JWT_SECRET:-development-access-secret-change-before-production}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development-refresh-secret-change-before-production}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-30d}

      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}

      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-lexodromia_refresh}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_REFRESH_COOKIE_MAX_AGE_MS: ${AUTH_REFRESH_COOKIE_MAX_AGE_MS:-2592000000}

      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/health/ready"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: lexodromia-frontend:latest
    container_name: lexodromia-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1/"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
